name: release-build
# Ad-hoc release binary builds, for a release draft asked for out of band (not part of the
# normal CI check — ci.yml covers that). `workflow_dispatch` only runs for a workflow file
# already on the default branch, which this deliberately is not yet, so it triggers on push to
# this one branch instead; drop the `push` trigger (or move this file to master) once that
# stops being needed.
on:
  push:
    branches: [release-build]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bin shimmer
      - run: |
          mkdir -p dist
          cp target/release/shimmer dist/shimmer-${{ matrix.os == 'macos-latest' && 'macos-arm64' || 'linux-x86_64' }}
      - uses: actions/upload-artifact@v4
        with:
          name: shimmer-${{ matrix.os }}
          path: dist/*
