[package]
name = "shimmer-daemon"
description = "Core services: registry, event bus, queue, IPC server, indexer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
shimmer-core = { path = "../core" }
shimmer-proto = { path = "../proto" }
shimmer-store = { path = "../store" }
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
ulid = "1"
toml = "1.1.6"
cron = "0.17.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
rand = "0.9"

[dev-dependencies]
chrono = "0.4"
tempfile = "3"
