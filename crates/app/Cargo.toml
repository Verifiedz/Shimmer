[package]
name = "shimmer"
description = "The only binary. Dispatches to the daemon, the mock daemon and the CLI (TUI dispatch lands with its crate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "shimmer"
path = "src/main.rs"

[dependencies]
shimmer-core = { path = "../core" }
shimmer-proto = { path = "../proto" }
shimmer-daemon = { path = "../daemon" }
shimmer-mockd = { path = "../mockd" }
shimmer-cli = { path = "../cli" }
shimmer-records = { path = "../modules/records" }
shimmer-workspaces = { path = "../modules/workspaces" }
shimmer-notify = { path = "../modules/notify" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"
shimmer-store = { path = "../store" }
tempfile = "3"
