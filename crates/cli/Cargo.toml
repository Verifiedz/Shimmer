[package]
name = "shimmer-cli"
description = "Thin client (lib): command parsing, daemon connection and auto-start, output rendering. Depends on core and proto only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
shimmer-core = { path = "../core" }
shimmer-proto = { path = "../proto" }
chrono = "0.4"
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }

[dev-dependencies]
chrono-tz = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
