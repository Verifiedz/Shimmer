# Built-in command pack (ADR 0013 §5, ADR 0015 §5).
# Dev culture: tickets, standups, deploys and postmortems.
# Built into the shimmer binary; unbranded by rule. Each alias runs shimmer plus the whole
# command, e.g. the activate alias with an id runs 'shimmer workspaces activate <id>'.

[pack]
id = "ship-it"
label = "Ship It"

[alias]
"on-call"      = "core.ping"
"ooo"          = "core.shutdown"
"readme"       = "core.manifest"
"boards"       = "records.collections"
"ticket"       = "records.add"
"triage"       = "records.list"
"blame"        = "records.get"
"amend"        = "records.update"
"lgtm"         = "records.complete"
"regression"   = "records.reopen"
"rebrand"      = "records.rename"
"wontfix"      = "records.remove"
"revert"       = "records.restore"
"envs"         = "workspaces.list"
"standup"      = "workspaces.status"
"deploy"       = "workspaces.activate"
"postmortem"   = "workspaces.cleanup"
"force-push"   = "workspaces.force_relaunch"
"rollback"     = "workspaces.reset"
# queue and scheduler (ADR 0015)
"pipeline"     = "queue.list"
"job-status"   = "queue.task"
"cancel-build" = "queue.cancel"
"bump"         = "queue.reorder"
"cron-jobs"    = "scheduler.list"
"schedule-it"  = "scheduler.add"
"code-freeze"  = "scheduler.pause"
"thaw"         = "scheduler.resume"
"deprecate"    = "scheduler.remove"
# every other command (ADR 0029)
"boilerplate"    = "records.templates"
"greenfield"     = "records.create_collection"
"graveyard"      = "records.trash"
"rm-rf"          = "records.purge"
"migrate"        = "records.import"
"dump"           = "records.export"
"lint"           = "records.check"
"refactor"       = "records.rename_field"
"pivot"          = "records.rename_collection"
"archive"        = "records.remove_collection"
"unarchive"      = "records.restore_collection"
"eod"            = "workspaces.stop"
"decommission"   = "workspaces.remove"
"cherry-pick"    = "workspaces.restore"
"rename-env"     = "workspaces.rename"
"fork"           = "workspaces.copy"
"hotfix"         = "workspaces.reconfigure"
"monkey-patch"   = "workspaces.edit"
"starter-kits"   = "workspaces.templates"
"code-review"    = "workspaces.peek"
"scaffold"       = "workspaces.create"
"eta"            = "scheduler.get"
# records peek, copy-collection and edit (ADR 0030)
"preview"        = "records.peek"
"copy-pasta"     = "records.copy_collection"
"tweak-schema"   = "records.edit"
