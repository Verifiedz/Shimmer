# Built-in command pack (ADR 0013 §5, ADR 0015 §5).
# Generic sci-fi starship, from no particular franchise.
# Built into the shimmer binary; unbranded by rule. Each alias runs shimmer plus the whole
# command, e.g. the activate alias with an id runs 'shimmer workspaces activate <id>'.

[pack]
id = "starship"
label = "Starship"

[alias]
"comms"           = "core.ping"
"cryo"            = "core.shutdown"
"blueprints"      = "core.manifest"
"fleets"          = "records.collections"
"waypoint"        = "records.add"
"logbook"         = "records.list"
"scan"            = "records.get"
"retrofit"        = "records.update"
"landed"          = "records.complete"
"re-entry"        = "records.reopen"
"redesignate"     = "records.rename"
"airlock"         = "records.remove"
"salvage"         = "records.restore"
"sectors"         = "workspaces.list"
"diagnostics"     = "workspaces.status"
"engage"          = "workspaces.activate"
"damage-control"  = "workspaces.cleanup"
"override"        = "workspaces.force_relaunch"
"cold-start"      = "workspaces.reset"
# queue and scheduler (ADR 0015)
"launch-queue"    = "queue.list"
"telemetry"       = "queue.task"
"abort"           = "queue.cancel"
"clearance"       = "queue.reorder"
"flight-schedule" = "scheduler.list"
"plot-course"     = "scheduler.add"
"hold-position"   = "scheduler.pause"
"full-ahead"      = "scheduler.resume"
"scrub-mission"   = "scheduler.remove"
# every other command (ADR 0029)
"starcharts"        = "records.templates"
"commission"        = "records.create_collection"
"debris-field"      = "records.trash"
"self-destruct"     = "records.purge"
"tractor-beam"      = "records.import"
"transmit"          = "records.export"
"sensor-sweep"      = "records.check"
"recalibrate"       = "records.rename_field"
"rename-fleet"      = "records.rename_collection"
"mothball"          = "records.remove_collection"
"recommission"      = "records.restore_collection"
"dock"              = "workspaces.stop"
"stand-down"        = "workspaces.remove"
"homecoming"        = "workspaces.restore"
"callsign"          = "workspaces.rename"
"sister-ship"       = "workspaces.copy"
"refit"             = "workspaces.reconfigure"
"engineering"       = "workspaces.edit"
"shipyard"          = "workspaces.templates"
"long-range-scan"   = "workspaces.peek"
"maiden-voyage"     = "workspaces.create"
"countdown"         = "scheduler.get"
# records peek, copy-collection and edit (ADR 0030)
"probe"             = "records.peek"
"twin-fleet"        = "records.copy_collection"
"drydock"           = "records.edit"
