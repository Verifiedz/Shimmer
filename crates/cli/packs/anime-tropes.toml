# Built-in command pack (ADR 0013 §5, ADR 0015 §5).
# Lines anime characters say: everything is an everyday expression any anime watcher
# knows (nani, yatta, yamete, …).
# Built into the shimmer binary; unbranded by rule. Each alias runs shimmer plus the whole
# command, e.g. the activate alias with an id runs 'shimmer workspaces activate <id>'.

[pack]
id = "anime-tropes"
label = "Anime Tropes"

[alias]
"ohayo"        = "core.ping"
"owari"        = "core.shutdown"
"nakama"       = "core.manifest"
"iroiro"       = "records.collections"
"kohai"        = "records.add"
"mite"         = "records.list"
"naruhodo"     = "records.show"
"senpai"       = "records.update"
"yatta"        = "records.complete"
"mou-ikkai"    = "records.reopen"
"kaimei"       = "records.rename"
"sayonara"     = "records.remove"
"okaeri"       = "records.restore"
"minna"        = "workspaces.list"
"nani"         = "workspaces.show"
"ikuzo"        = "workspaces.activate"
"daijoubu"     = "workspaces.cleanup"
"yatte-yaru"   = "workspaces.force_relaunch"
"tadaima"      = "workspaces.reset"
# queue and scheduler (ADR 0015)
"mada-mada"    = "queue.list"
"misete"       = "queue.show"
"yamete"       = "queue.cancel"
"hayaku"       = "queue.move"
"jaa-ne"       = "scheduler.list"
"kimeta"       = "scheduler.add"
"henkou"       = "scheduler.edit"
"chotto-matte" = "scheduler.disable"
"hajime"       = "scheduler.enable"
"mou-ii"       = "scheduler.remove"
"fukkatsu"     = "scheduler.restore"
"shuuryou"     = "scheduler.purge"
# every other command (ADR 0029)
"sugoi"          = "records.templates"
"yosh"           = "records.new"
"itai"           = "records.purge"
"irasshaimase"   = "records.import"
"ganbatte"       = "records.export"
"uso"            = "records.check"
"henshin"        = "records.rename_field"
"kakkoii"        = "records.rename_collection"
"oyasumi"        = "records.remove_collection"
"okaerinasai"    = "records.restore_collection"
"zannen"         = "records.purge_collection"
"otsukare"       = "workspaces.stop"
"mata-ne"        = "workspaces.remove"
"hisashiburi"    = "workspaces.restore"
"bakuhatsu"      = "workspaces.purge"
"dare-da"        = "workspaces.rename"
"bunshin"        = "workspaces.copy"
"chotto"         = "workspaces.reconfigure"
"mendokusai"     = "workspaces.edit"
"kawaii"         = "workspaces.templates"
"hontou"         = "workspaces.peek"
"yoroshiku"      = "workspaces.new"
"itsu"           = "scheduler.show"
# records peek, copy-collection and edit (ADR 0030)
"hora"           = "records.peek"
"futago"         = "records.copy_collection"
"kaizou"         = "records.edit"
# fetchers (ADR 0028, ADR 0029)
"sagasu"         = "fetchers.list"
"machiawase"     = "fetchers.status"
"teisatsu"       = "fetchers.test"
"shutsugeki"     = "fetchers.run"
"shuukaku"       = "fetchers.items"
"tegami"     = "notify.list"
"kore"       = "notify.show"
"ikutsu"     = "notify.count"
"wakatta"    = "notify.mark_read"
"ato-de"     = "notify.mark_unread"
"keshite"    = "notify.remove"
"oshirase"   = "notify.send"
"kikoeru"    = "notify.test"
"mou-ichido" = "notify.resend"
"yasumi"     = "notify.pause"
"okite"      = "notify.resume"
"shizuka-ni" = "notify.quiet"
"genki"      = "notify.status"
"keikoku"    = "notify.builtin_alerts"
"genkai"     = "notify.cap"
