# Built-in command pack (ADR 0013 §5, ADR 0015 §5).
# Fewest keystrokes: plain words for core commands, then r… records, w… workspaces,
# q… queue, s… scheduler.
# Built into the shimmer binary; unbranded by rule. Each alias runs shimmer plus the whole
# command, e.g. the activate alias with an id runs 'shimmer workspaces activate <id>'.

[pack]
id = "short"
label = "Short"

[alias]
"up"      = "core.ping"
"down"    = "core.shutdown"
"ops"     = "core.manifest"
"rcol"    = "records.collections"
"radd"    = "records.add"
"rlist"   = "records.list"
"rshow"   = "records.show"
"rset"    = "records.update"
"rdone"   = "records.complete"
"rreopen" = "records.reopen"
"rmv"     = "records.rename"
"rrm"     = "records.remove"
"rundo"   = "records.restore"
"wlist"   = "workspaces.list"
"wshow"   = "workspaces.show"
"wgo"     = "workspaces.activate"
"wclean"  = "workspaces.cleanup"
"wforce"  = "workspaces.force_relaunch"
"wreset"  = "workspaces.reset"
# queue and scheduler (ADR 0015)
"qlist"   = "queue.list"
"qshow"   = "queue.show"
"qcancel" = "queue.cancel"
"qmove"   = "queue.move"
"slist"   = "scheduler.list"
"sadd"    = "scheduler.add"
"sedit"   = "scheduler.edit"
"sdisable" = "scheduler.disable"
"senable" = "scheduler.enable"
"sdel"    = "scheduler.remove"
"sundo"   = "scheduler.restore"
"spurge"  = "scheduler.purge"
# every other command (ADR 0029)
"rtpl"       = "records.templates"
"rnew"       = "records.new"
"rpurge"     = "records.purge"
"rimport"    = "records.import"
"rexport"    = "records.export"
"rcheck"     = "records.check"
"rmvfield"   = "records.rename_field"
"rmvcol"     = "records.rename_collection"
"rrmcol"     = "records.remove_collection"
"rundocol"   = "records.restore_collection"
"rpurgcol"   = "records.purge_collection"
"wstop"      = "workspaces.stop"
"wrm"        = "workspaces.remove"
"wundo"      = "workspaces.restore"
"wpurge"     = "workspaces.purge"
"wmv"        = "workspaces.rename"
"wcp"        = "workspaces.copy"
"wset"       = "workspaces.reconfigure"
"wedit"      = "workspaces.edit"
"wtpl"       = "workspaces.templates"
"wpeek"      = "workspaces.peek"
"wnew"       = "workspaces.new"
"sshow"      = "scheduler.show"
# records peek, copy-collection and edit (ADR 0030)
"rpeek"      = "records.peek"
"rcpcol"     = "records.copy_collection"
"redit"      = "records.edit"
# fetchers (ADR 0028, ADR 0029)
"flist"      = "fetchers.list"
"fstat"      = "fetchers.status"
"ftest"      = "fetchers.test"
"frun"       = "fetchers.run"
"fitems"     = "fetchers.items"
"nlist"   = "notify.list"
"nshow"   = "notify.show"
"ncount"  = "notify.count"
"nread"   = "notify.mark_read"
"nunread" = "notify.mark_unread"
"nrm"     = "notify.remove"
"nsend"   = "notify.send"
"ntest"   = "notify.test"
"nresend" = "notify.resend"
"npause"  = "notify.pause"
"nresume" = "notify.resume"
"nquiet"  = "notify.quiet"
"nst"     = "notify.status"
"nalerts" = "notify.builtin_alerts"
"ncap"    = "notify.cap"
