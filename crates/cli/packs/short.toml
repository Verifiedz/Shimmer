# Built-in command pack (ADR 0013 §5, ADR 0015 §5).
# Fewest keystrokes: plain words for core commands, then r… records, w… workspaces,
# q… queue, s… scheduler.
# Built into the shimmer binary; unbranded by rule. Each alias runs shimmer plus the whole
# command, e.g. the activate alias with an id runs 'shimmer workspaces activate <id>'.

[pack]
id = "short"
label = "Short"

[alias]
"up"      = "core.ping"
"down"    = "core.shutdown"
"ops"     = "core.manifest"
"rcol"    = "records.collections"
"radd"    = "records.add"
"rlist"   = "records.list"
"rget"    = "records.get"
"rset"    = "records.update"
"rdone"   = "records.complete"
"rreopen" = "records.reopen"
"rmv"     = "records.rename"
"rrm"     = "records.remove"
"rundo"   = "records.restore"
"wlist"   = "workspaces.list"
"wst"     = "workspaces.status"
"wgo"     = "workspaces.activate"
"wclean"  = "workspaces.cleanup"
"wforce"  = "workspaces.force_relaunch"
"wreset"  = "workspaces.reset"
# queue and scheduler (ADR 0015)
"qlist"   = "queue.list"
"qget"    = "queue.task"
"qcancel" = "queue.cancel"
"qmove"   = "queue.reorder"
"slist"   = "scheduler.list"
"sadd"    = "scheduler.add"
"spause"  = "scheduler.pause"
"sresume" = "scheduler.resume"
"sdel"    = "scheduler.remove"
# every other command (ADR 0029)
"rtpl"       = "records.templates"
"rnew"       = "records.create_collection"
"rtrash"     = "records.trash"
"rpurge"     = "records.purge"
"rimport"    = "records.import"
"rexport"    = "records.export"
"rcheck"     = "records.check"
"rmvfield"   = "records.rename_field"
"rmvcol"     = "records.rename_collection"
"rrmcol"     = "records.remove_collection"
"rundocol"   = "records.restore_collection"
"wstop"      = "workspaces.stop"
"wrm"        = "workspaces.remove"
"wundo"      = "workspaces.restore"
"wmv"        = "workspaces.rename"
"wcp"        = "workspaces.copy"
"wset"       = "workspaces.reconfigure"
"wedit"      = "workspaces.edit"
"wtpl"       = "workspaces.templates"
"wpeek"      = "workspaces.peek"
"wnew"       = "workspaces.create"
"sget"       = "scheduler.get"
