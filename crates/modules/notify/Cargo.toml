[package]
name = "shimmer-notify"
description = "The notify module (ADR 0032): an inbox of every message, quiet hours, pause and sinks. Depends on core only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
shimmer-core = { path = "../../core" }
async-trait = "0.1"
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
toml = "1"
ulid = "1"

[dev-dependencies]
shimmer-core = { path = "../../core", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt"] }
