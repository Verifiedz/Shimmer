[template]
label = "New itch.io games by tag"
description = "Newest games tagged with one genre or keyword on itch.io"
category = "gaming"
kind = "rss"
good_to_know = [
    "The tag is the part of itch.io's own browse url after /tag-, e.g. itch.io/games/newest/tag-roguelike is roguelike",
]

[[question]]
name = "TAG"
prompt = "The tag to track (e.g. roguelike, platformer, metroidvania)"
kind = "name"
required = true

[source]
text = '''
[source]
enabled = false
interval = "daily"
kind = "rss"

[kind]
url = "https://itch.io/games/newest/tag-${TAG}.xml"
'''
