[template]
label = "Steam deals (CheapShark)"
description = "Price-drop alerts for Steam games under a price, from CheapShark's deals API"
category = "gaming"
kind = "json-api"
good_to_know = [
    "Free API, no key needed -- storeID=1 is Steam; CheapShark covers other stores too, but this template is Steam-only",
    "Re-checks the same deal list every run: dedup keeps it from re-notifying about a deal you've already seen",
]

[[question]]
name = "MAX_PRICE"
prompt = "Only deals at or under this price in dollars (e.g. 10)"
kind = "name"
required = true

[source]
text = '''
[source]
enabled = false
interval = "daily"
kind = "json-api"

[kind]
url = "https://www.cheapshark.com/api/1.0/deals?storeID=1&upperPrice=${MAX_PRICE}&pageSize=60"
id_field = "dealID"
title_field = "title"
url_field = "steamAppID"
url_base = "https://store.steampowered.com/app"
'''
