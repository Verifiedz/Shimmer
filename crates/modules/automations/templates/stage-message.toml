[template]
label = "Tell me when a field reaches a value"
description = "A message when a record's field changes to a value: an offer, a rejection, a deadline passed"
category = "messages"
good_to_know = [
    "It only sends a message: nothing else changes",
    "Only when the field changes to that value: editing something else on the record doesn't send it again",
]

[[question]]
name = "COLLECTION"
prompt = "Which collection (its id)"
kind = "name"
required = true

[[question]]
name = "FIELD"
prompt = "Which field (e.g. stage)"
kind = "name"
required = true

[[question]]
name = "VALUE"
prompt = "When it becomes (e.g. offer)"
kind = "text"
required = true

[[question]]
name = "PRIORITY"
prompt = "How loud"
kind = "choice"
choices = ["low", "normal", "high"]
default = "high"

[[rule]]
text = '''
[rule]
label = "Tell me when ${FIELD} becomes ${VALUE} in ${COLLECTION}"
on = "records.item.updated"
when = { collection = "${COLLECTION}", "item.${FIELD}" = "${VALUE}", changed = "${FIELD}" }

[[do]]
op = "notify.send"
params = { title = "{title}: ${FIELD} is now ${VALUE}", priority = "${PRIORITY}" }
'''
