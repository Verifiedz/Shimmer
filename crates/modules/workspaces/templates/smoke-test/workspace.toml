# Smoke test: a workspace that opens nothing, for checking that workspaces work on this machine.
# Created from Shimmer's smoke-test template. It's your folder now: edit it freely.
#
#   shimmer workspaces activate <id> --wait     ready → launching → active
#   shimmer workspaces stop <id> --wait         active → ready
#   shimmer workspaces show <id>                each step, and the log of a failed one
#
# To see a launch go dirty: shimmer workspaces reconfigure <id> --set FAIL_AT=check, then
#   shimmer workspaces cleanup <id> --wait      dirty → ready (unless FAIL_AT = "cleanup")
#
# Step 1's log lists every SHIMMER_* variable the scripts receive, and runs `shimmer ping`
# through SHIMMER_SOCKET, so you can check both by hand.

[workspace]
label = "Smoke test"
description = "Opens nothing: launches, fails and cleans up on purpose"

[[step]]
name = "check"
description = "Print the SHIMMER_* variables and ping the daemon"
mode = "supervised"
timeout_s = 30

[[step]]
name = "wait"
description = "A supervised step that takes a moment"
mode = "supervised"
timeout_s = 15

[[step]]
name = "background"
description = "A detached step that keeps running after the launch"
mode = "detached"

[cleanup]
timeout_s = 15
