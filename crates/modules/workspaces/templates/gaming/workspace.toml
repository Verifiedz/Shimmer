# Gaming: Steam, a game of your choice (or a picker over several, GAME_LIBRARY), system/GPU
# monitors, a browser, and a VM (VM_NAME, opened in Virtual Machine Manager), opened together.
# Created from Shimmer's gaming template. It's your folder now: edit it freely.
#
#   shimmer workspaces activate <id> --wait     open it all
#   shimmer workspaces stop <id> --wait         close what it placed, and list what it left open
#   shimmer workspaces reconfigure <id>         change your answers (the [env] table at the bottom)
#
# Every question is optional: leave one empty and that step does nothing.
#
# A *_PLACE question (e.g. STEAM_PLACE = "1:main") puts that app on a workspace and monitor
# with `hyprctl dispatch exec`, the same technique the daily-dev template uses: nothing is
# ever read from or written to your Hyprland config. `workspaces stop` closes a placed app by
# the exact window it remembers putting there -- never by guessing from class or title, which
# could just as easily match a window that has nothing to do with this workspace.

[workspace]
label = "Gaming"
description = "Steam, a game, monitors, a browser, and a VM, opened together"

[[step]]
name = "check"
description = "The commands you've asked for exist, and every *_PLACE answer is valid"
mode = "supervised"
timeout_s = 15

[[step]]
name = "steam"
description = "Open Steam, placed by STEAM_PLACE if set"
mode = "detached"

[[step]]
name = "game-prelaunch"
description = "Run GAME_PRELAUNCH_COMMAND, if set, and wait for it"
mode = "supervised"
timeout_s = 30

[[step]]
name = "game"
description = "Launch your game (or the GAME_LIBRARY picker), placed by GAME_PLACE if set"
mode = "detached"

[[step]]
name = "system-monitor"
description = "Open the system monitor, in its own terminal, placed by MONITORS_PLACE if set"
mode = "detached"

[[step]]
name = "gpu-monitor"
description = "Open the GPU monitor, in its own terminal, placed by MONITORS_PLACE if set"
mode = "detached"

[[step]]
name = "browser"
description = "Open your browser, placed by BROWSER_PLACE if set"
mode = "detached"

[[step]]
name = "vm"
description = "Open Virtual Machine Manager on VM_NAME, placed by VM_PLACE if set"
mode = "detached"

[cleanup]
timeout_s = 20
